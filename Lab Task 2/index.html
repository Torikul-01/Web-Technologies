<!DOCTYPE html>
<html>
<head>
    <title>Login Form</title>
</head>
<body>
        
    <h1>Login Form</h1>

    <form id="loginForm">
        <label>Email :</label>
        <input type="text" id="email"><br/><br/>

        <label>Password :</label>
        <input type="password" id="password"><br/><br/>

        <button type="submit">Login</button>
    </form>

    <!-- IMPORTANT PART -->
    <p id="error" style="color:red;"></p>
    <p id="count"></p>

    <script src="script.js"></script>

</body>
</html
